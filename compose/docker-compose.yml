services:
  frontend:
    build:
      context: ..
      dockerfile: services/frontend/Dockerfile
    container_name: zero-trust-frontend
    hostname: frontend
    networks:
      - frontend-net
      - backend-net
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    environment:
      - SERVICE_NAME=frontend
      - BACKEND_URL=http://backend:5000
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
    container_name: zero-trust-backend
    hostname: backend
    networks:
      - backend-net
    expose:
      - "5000"
    environment:
      - SERVICE_NAME=backend
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped

  attacker:
    build:
      context: ..
      dockerfile: services/attacker/Dockerfile
    container_name: zero-trust-attacker
    hostname: attacker
    networks:
      - isolated-net
    environment:
      - SERVICE_NAME=attacker
      - SCAN_MODE=compose
    command: ["tail", "-f", "/dev/null"]
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m
    restart: "no"

networks:
  frontend-net:
    driver: bridge
    name: zero-trust-frontend-net
    ipam:
      config:
        - subnet: 172.20.0.0/24

  backend-net:
    driver: bridge
    name: zero-trust-backend-net
    ipam:
      config:
        - subnet: 172.21.0.0/24

  isolated-net:
    driver: bridge
    name: zero-trust-isolated-net
    ipam:
      config:
        - subnet: 172.22.0.0/24
